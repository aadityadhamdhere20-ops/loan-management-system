<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loan Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <h1>Loan Management System</h1>
  <div>
    <span id="userInfo">Not logged in</span>
    <button id="logoutBtn" class="btn hidden">Logout</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <button class="nav active" data-view="loginView">Login</button>
    <button class="nav" data-view="registerView">Register</button>
    <button class="nav auth-only" data-view="applyView">Apply Loan</button>
    <button class="nav auth-only" data-view="myLoansView">My Loans</button>
    <button class="nav auth-only" data-view="emiView">EMI</button>
    <button class="nav admin-only" data-view="adminView">Admin Panel</button>
  </aside>

  <main class="content">
    <div id="alert" class="alert hidden"></div>

    <section id="loginView" class="view active card">
      <h2>Login</h2>
      <form id="loginForm" class="form">
        <input name="username" type="email" placeholder="Email" required>
        <input name="password" type="password" placeholder="Password" required>
        <button class="btn primary">Login</button>
      </form>
    </section>

    <section id="registerView" class="view card">
      <h2>Register Customer</h2>
      <form id="registerForm" class="form grid2">
        <input name="fullName" placeholder="Full Name" required>
        <input name="email" type="email" placeholder="Email" required>
        <input name="mobileNumber" placeholder="Mobile Number" required>
        <input name="password" type="password" placeholder="Password" required>
        <input name="age" type="number" placeholder="Age" required>
        <input name="monthlyIncome" type="number" placeholder="Monthly Income" required>
        <button class="btn primary span2">Register</button>
      </form>
    </section>

    <section id="applyView" class="view card">
      <h2>Apply Loan</h2>
      <form id="loanForm" class="form grid2">
        <select name="loanType" required>
          <option value="PERSONAL">Personal Loan</option>
          <option value="HOME">Home Loan</option>
          <option value="VEHICLE">Vehicle Loan</option>
          <option value="EDUCATION">Education Loan</option>
          <option value="BUSINESS">Business Loan</option>
        </select>
        <input name="requestedAmount" type="number" placeholder="Loan Amount" required>
        <input name="tenureMonths" type="number" placeholder="Tenure Months" required>
        <button class="btn primary span2">Submit Application</button>
      </form>
    </section>

    <section id="myLoansView" class="view">
      <h2>My Loan Applications</h2>
      <button id="refreshLoans" class="btn">Refresh</button>
      <div id="loanList" class="cards"></div>
    </section>

    <section id="emiView" class="view card">
      <h2>EMI Schedule</h2>
      <form id="emiSearchForm" class="form">
        <input name="loanAccountId" type="number" placeholder="Loan Account ID" required>
        <button class="btn primary">View EMI</button>
      </form>
      <div id="emiList"></div>
    </section>

    <section id="adminView" class="view">
      <h2>Admin Dashboard</h2>
      <button id="refreshAdmin" class="btn">Refresh</button>
      <div id="dashboardCards" class="stats"></div>
      <div id="adminLoans"></div>
    </section>
  </main>
</div>

<script src="js/app.js"></script>
</body>
</html>
