spring.application.name=loan-management-system
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/loan_management_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=2002

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

app.jwt.secret=loanmanagementsystemsecretkeyloanmanagementsystemsecretkey
app.jwt.expiration=86400000
app.upload.dir=uploads

springdoc.swagger-ui.path=/swagger-ui.html

app.admin.email=admin@lms.com
app.admin.password=admin123